<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Explorer</title>
    
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.jsdelivr.net/npm/webxr-polyfill@latest/build/webxr-polyfill.js"></script>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <link rel="stylesheet" href="style.css">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VR Explorer">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>

    <div id="home-screen">
        <h1><i>VR Explorer</i></h1>
        <h2>Step 1: Select Simulation</h2>
        <div class="dropdown-container"><select id="dropdown-audiences"><option value="">Presentation Audiences...</option></select></div>
        <p class="or-divider">or</p>
        <div class="dropdown-container"><select id="dropdown-scenarios"><option value="">Special Scenarios...</option></select></div>

        <h2>Step 2: Enter Simulation</h2>
        <button id="go-button">Go</button>

        <details class="optional-settings-dropdown">
            <summary class="optional-title">Optional Settings</summary>
            <div class="settings-content">
                <div class="toggle-container">
                    <label class="switch"><input type="checkbox" id="override-ipd"><span class="slider"></span></label>
                    <span>Override Default IPD</span>
                </div>
                <div class="slider-wrapper disabled" id="ipd-wrapper">
                    <label for="ipd-slider">IPD Adjustment: <span id="ipd-val">64</span> mm</label>
                    <input type="range" id="ipd-slider" min="55" max="75" value="64" step="0.5" disabled>
                </div>
                <div class="toggle-container">
                    <label class="switch"><input type="checkbox" id="override-zoom"><span class="slider"></span></label>
                    <span>Override Default Zoom</span>
                </div>
                <div class="slider-wrapper disabled" id="zoom-wrapper">
                    <label for="zoom-slider">Zoom Factor: <span id="zoom-val">1.0</span>x</label>
                    <input type="range" id="zoom-slider" min="0.5" max="2.0" value="1.0" step="0.1" disabled>
                </div>
                <div class="toggle-container">
                    <label class="switch"><input type="checkbox" id="safe-mode"><span class="slider"></span></label>
                    <span>Safe Mode</span>
                </div>
            </div>
        </details>
        <footer><i>VR Explorer 1.36 brought to you by Cambridge VR</i></footer>
    </div>

    <div id="video-screen">
        <a-scene id="vr-scene" vr-mode-ui="enabled: true" renderer="antialias: true; colorManagement: true;">
            <a-assets><video id="video-src" loop playsinline muted crossorigin="anonymous" webkit-playsinline></video></a-assets>
            
            <a-videosphere id="video-sphere" src="#video-src"></a-videosphere>

            <a-entity id="camera-rig" position="0 0 0" ipd-manager>
                <a-camera id="camera" position="0 1.6 0"></a-camera>
            </a-entity>
        </a-scene>

        <div id="loader"></div>
        <button id="play-button">▶</button>
        
        <button id="force-vr-button">ENTER VR MODE</button>

        <button id="back-button">✖</button>
        <button id="unmute-button"></button>
    </div>

    <script src="video-data.js"></script>

    <script>
        // 1. Force Polyfill
        const polyfill = new WebXRPolyfill();

        // 2. IPD/Zoom Manager Component
        AFRAME.registerComponent('ipd-manager', {
            tick: function () {
                // IPD FIX: Scale the Rig
                const overrideIpd = document.getElementById('override-ipd');
                if (overrideIpd && overrideIpd.checked) {
                    const ipdSlider = document.getElementById('ipd-slider');
                    // Scale Logic: 64 / current = scale factor
                    // If IPD is high (70), scale is < 1 (World smaller, eyes wider)
                    const scale = 64 / parseFloat(ipdSlider.value);
                    this.el.object3D.scale.set(scale, scale, scale);
                } else {
                    this.el.object3D.scale.set(1, 1, 1);
                }

                // ZOOM FIX: Three.js Zoom Property
                const overrideZoom = document.getElementById('override-zoom');
                const cam = this.el.querySelector('a-camera');
                if (cam && overrideZoom && overrideZoom.checked) {
                    const zoomSlider = document.getElementById('zoom-slider');
                    const threeCam = cam.getObject3D('camera');
                    if (threeCam) {
                        threeCam.zoom = parseFloat(zoomSlider.value);
                        threeCam.updateProjectionMatrix();
                    }
                } else if (cam) {
                    const threeCam = cam.getObject3D('camera');
                    if(threeCam && threeCam.zoom !== 1) {
                        threeCam.zoom = 1;
                        threeCam.updateProjectionMatrix();
                    }
                }
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            // Elements
            const homeScreen = document.getElementById('home-screen');
            const videoScreen = document.getElementById('video-screen');
            const goButton = document.getElementById('go-button');
            const backButton = document.getElementById('back-button');
            const unmuteButton = document.getElementById('unmute-button');
            const loader = document.getElementById('loader');
            const playButton = document.getElementById('play-button');
            const forceVrButton = document.getElementById('force-vr-button');
            const vrScene = document.getElementById('vr-scene');
            const videoAsset = document.getElementById('video-src');
            const videoSphere = document.getElementById('video-sphere');
            
            // Settings
            const dropdownAudiences = document.getElementById('dropdown-audiences');
            const dropdownScenarios = document.getElementById('dropdown-scenarios');
            const safeMode = document.getElementById('safe-mode');
            const overrideIpd = document.getElementById('override-ipd');
            const ipdWrapper = document.getElementById('ipd-wrapper');
            const ipdSlider = document.getElementById('ipd-slider');
            const ipdLabel = document.getElementById('ipd-val');
            const overrideZoom = document.getElementById('override-zoom');
            const zoomWrapper = document.getElementById('zoom-wrapper');
            const zoomSlider = document.getElementById('zoom-slider');
            const zoomLabel = document.getElementById('zoom-val');

            // Is iOS?
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

            // Setup
            Object.keys(audienceVideos).forEach(key => dropdownAudiences.add(new Option(key, key)));
            Object.keys(scenarioVideos).forEach(key => dropdownScenarios.add(new Option(key, key)));
            
            // Listeners
            dropdownAudiences.addEventListener('change', () => { if (dropdownAudiences.value) dropdownScenarios.value = ''; });
            dropdownScenarios.addEventListener('change', () => { if (dropdownScenarios.value) dropdownAudiences.value = ''; });
            
            ipdSlider.addEventListener('input', () => ipdLabel.textContent = ipdSlider.value);
            zoomSlider.addEventListener('input', () => zoomLabel.textContent = zoomSlider.value);

            overrideIpd.addEventListener('change', () => {
                ipdSlider.disabled = !overrideIpd.checked;
                ipdWrapper.classList.toggle('disabled', !overrideIpd.checked);
            });
            overrideZoom.addEventListener('change', () => {
                zoomSlider.disabled = !overrideZoom.checked;
                zoomWrapper.classList.toggle('disabled', !overrideZoom.checked);
            });

            const videoLoaded = () => {
                loader.style.display = 'none';
                playButton.style.display = 'block';
            };
            const videoError = (e) => {
                console.error("Video Error:", e);
                videoAsset.removeEventListener('error', videoError);
                backButton.click();
                alert("Error loading video.");
            };

            // GO Click
            goButton.addEventListener('click', () => {
                // iOS Permission Request
                if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                    DeviceMotionEvent.requestPermission().then(r => { 
                        if (r === 'granted') loadVideo(); 
                        else alert('Motion permission required for VR.'); 
                    }).catch(e => loadVideo());
                } else {
                    loadVideo();
                }
            });

            function loadVideo() {
                const key = dropdownAudiences.value || dropdownScenarios.value;
                if (!key) { alert('Select a simulation.'); return; }
                const data = audienceVideos[key] || scenarioVideos[key];

                if (safeMode.checked) { window.location.href = data.youtube; return; }

                homeScreen.style.display = 'none';
                videoScreen.style.display = 'block';
                unmuteButton.innerHTML = '🔇';
                loader.style.display = 'block';
                playButton.style.display = 'none';

                // BUTTON LOGIC: Only show Custom Button on iOS
                if (isIOS) {
                    forceVrButton.style.display = 'block';
                    // Hide native button if it exists
                    const nativeBtn = document.querySelector('.a-enter-vr-button');
                    if(nativeBtn) nativeBtn.style.display = 'none';
                } else {
                    forceVrButton.style.display = 'none';
                }

                videoSphere.addEventListener('materialvideoloadeddata', videoLoaded, { once: true });
                videoAsset.addEventListener('error', videoError, { once: true });
                videoAsset.muted = true;
                videoAsset.setAttribute('src', data.cloudflare);

                if (vrScene.hasLoaded) vrScene.play();
                else vrScene.addEventListener('loaded', () => vrScene.play());
            }

            playButton.addEventListener('click', () => {
                videoAsset.play();
                playButton.style.display = 'none';
            });

            forceVrButton.addEventListener('click', () => {
                videoAsset.play();
                vrScene.enterVR();
            });

            backButton.addEventListener('click', () => {
                videoScreen.style.display = 'none';
                homeScreen.style.display = 'block';
                loader.style.display = 'none';
                playButton.style.display = 'none';
                forceVrButton.style.display = 'none';
                
                videoSphere.removeEventListener('materialvideoloadeddata', videoLoaded);
                videoAsset.removeEventListener('error', videoError);
                videoAsset.pause();
                videoAsset.setAttribute('src', '');
                if(vrScene.is('vr-mode')) vrScene.exitVR();
                vrScene.pause();
                videoAsset.muted = true;
                if (document.fullscreenElement) document.exitFullscreen();
            });

            unmuteButton.addEventListener('click', () => {
                if (videoAsset.muted) {
                    videoAsset.muted = false;
                    unmuteButton.innerHTML = '🔈';
                } else {
                    videoAsset.muted = true;
                    unmuteButton.innerHTML = '🔇';
                }
            });

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/ExplorerTest36/sw.js');
                });
            }
        });
    </script>
</body>
</html>
